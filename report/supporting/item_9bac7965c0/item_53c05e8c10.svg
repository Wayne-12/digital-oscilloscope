<text x="520" y="792" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#216EAA">R/G/B[3:0]、HSYNC、VSYNC</text>
<polyline points="1310,680 1310,825 1875,825 1875,915" fill="none" stroke="#216EAA" stroke-width="4"/>
<polygon points="1875,915 1867.1497540157948,899.9210863127522 1882.8502459842052,899.9210863127522" fill="#216EAA"/>
<polygon points="1310,680 1317.8502459842052,695.0789136872478 1302.1497540157948,695.0789136872478" fill="#216EAA"/>
<text x="1690" y="792" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#216EAA">FPGA TX：T4；RX：N5</text>
<polyline points="1100,1005 1100,680" fill="none" stroke="#8553A5" stroke-width="4"/>
<polygon points="1100,680 1107.8502459842052,695.0789136872478 1092.1497540157948,695.0789136872478" fill="#8553A5"/>
<text x="1240" y="927" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#8553A5">按键 / 拨码输入</text>
<text x="1100" y="1230" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#20384B">方向以箭头为准：蓝色为数字数据 / 视频 / 通信，紫色为时钟 / 控制，棕红为供电，绿色为模拟回环</text>
<text x="1100" y="1290" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#20384B">本图按项目连接与约束文件整理；模块内部电路见对应原理图。</text>
</svg>